name: Build VCV Rack Plugin
on: [push, pull_request]

env:
  rack-sdk-version: 2.6.6
  rack-plugin-toolchain-dir: /home/build/rack-plugin-toolchain
  # Fail the build on any compiler warning in the plugin's own code. See the Makefile.
  WERROR: 1

# A newer push cancels the older, now pointless, run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  modify-plugin-version:
    name: Modify plugin version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gitrev=`git rev-parse --short HEAD`
          pluginversion=`jq -r '.version' plugin.json`
          echo "Set plugin version from $pluginversion to $pluginversion-$gitrev"
          cat <<< `jq --arg VERSION "$pluginversion-$gitrev" '.version=$VERSION' plugin.json` > plugin.json
        # only modify plugin version if no tag was created
        if: "! startsWith(github.ref, 'refs/tags/v')"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-json
          path: plugin.json

  build:
    name: ${{ matrix.platform }}
    needs: modify-plugin-version
    runs-on: ubuntu-latest
    container:
      # Pinned by digest so a new toolchain release can't silently change or break builds.
      # To update, run:
      # `docker buildx imagetools inspect ghcr.io/bloodbat/rack-plugin-toolchain-win-linux`
      # and replace the digest here and in metamodule-check.
      image: ghcr.io/bloodbat/rack-plugin-toolchain-win-linux@sha256:eaf4bab677166ecd96c270f928c3c67da7bea29c675f23e43662e28a25cb1f63
      options: --user root
    strategy:
      matrix:
        platform: [win-x64, lin-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: plugin-json
      - name: Build plugin
        run: |
          export PLUGIN_DIR=$GITHUB_WORKSPACE
          pushd ${{ env.rack-plugin-toolchain-dir }}
          make plugin-build-${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.rack-plugin-toolchain-dir }}/plugin-build
          name: ${{ matrix.platform }}

  # Note: The MetaModule build uses the Rack SDK, not the MetaModule SDK.
  # So it only confirms the #ifdef METAMODULE paths compile, not that the
  # MetaModule plugin builds.
  metamodule-check:
    name: METAMODULE compile check
    runs-on: ubuntu-latest
    container:
      # Same pinned image as the build job.
      image: ghcr.io/bloodbat/rack-plugin-toolchain-win-linux@sha256:eaf4bab677166ecd96c270f928c3c67da7bea29c675f23e43662e28a25cb1f63
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build plugin with METAMODULE defined
        env:
          EXTRA_FLAGS: -DMETAMODULE
        run: |
          export PLUGIN_DIR=$GITHUB_WORKSPACE
          pushd ${{ env.rack-plugin-toolchain-dir }}
          make plugin-build-lin-x64

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmllint and libRack's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils libgl1 libx11-6 libasound2t64 libjack-jackd2-0 libpulse0
      - name: Check SVGs, build and run unit tests
        run: make -C tests
      - name: Get Rack-SDK
        run: |
          cd "$HOME"
          wget -O Rack-SDK.zip \
            https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-lin-x64.zip
          unzip Rack-SDK.zip
      - name: Build and run Rack unit tests
        run: make -C tests rack RACK_DIR="$HOME/Rack-SDK"

  compare:
    name: Compare with last release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and tags: the comparison builds the last release tag's sources.
          fetch-depth: 0
      - name: Install libRack's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libx11-6 libasound2t64 libjack-jackd2-0 libpulse0
      - name: Get Rack-SDK
        run: |
          cd "$HOME"
          wget -O Rack-SDK.zip \
            https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-lin-x64.zip
          unzip Rack-SDK.zip
      - name: Compare behaviour with the last release
        run: RACK_DIR="$HOME/Rack-SDK" tests/compare/compare.sh
      - name: Upload the comparison's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compare-logs
          path: tests/build/compare

  build-mac:
    name: mac-${{ matrix.arch }}
    needs: modify-plugin-version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cross_compile: x86_64-apple-darwin
          - arch: arm64
            cross_compile: arm64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: plugin-json
      - name: Get Rack-SDK
        run: |
          cd "$HOME"
          wget -O Rack-SDK.zip \
            https://vcvrack.com/downloads/Rack-SDK-${{ env.rack-sdk-version }}-mac-${{ matrix.arch }}.zip
          unzip Rack-SDK.zip
          echo "RACK_DIR=$HOME/Rack-SDK" >> "$GITHUB_ENV"
      - name: Build plugin
        run: |
          export CROSS_COMPILE=${{ matrix.cross_compile }}
          make dep
          make dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist/*.vcvplugin
          name: mac-${{ matrix.arch }}

  publish:
    name: Publish plugin
    # only create a release if a tag was created that is called e.g. v1.2.3
    # see also https://vcvrack.com/manual/Manifest#version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:  [build, build-mac, metamodule-check, tests, compare]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check if plugin version matches tag
        run: |
          pluginversion=`jq -r '.version' plugin.json`
          if [ "v$pluginversion" != "$GITHUB_REF_NAME" ]; then
            echo "Plugin version from plugin.json 'v$pluginversion' doesn't match with tag version '$GITHUB_REF_NAME'"
            exit 1
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            ${{ github.event.repository.name }} VCV Rack Plugin ${{ github.ref_name }}
          draft: false
          prerelease: false
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: _artifacts/**/*.vcvplugin
          tag: ${{ github.ref }}
          file_glob: true
